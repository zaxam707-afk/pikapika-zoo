<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="どろんこの どうぶつを ゆびで ごしごし あらって ピカピカにする こども向けゲーム">
<meta name="theme-color" content="#7fcdf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ピカピカ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>ピカピカどうぶつえん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* layout: one full-screen canvas zoo pen; HTML cards float over it for title and result */
:root{
  --sky:#7fcdf3; --grass:#7cc85a; --ink:#3b2a1e; --cream:#fffaf0;
  --sun:#ffcf3f; --berry:#ff6f91; --pool:#bfe9ff;
  --font-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",sans-serif;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",sans-serif;
  color-scheme: light;
}
html{box-sizing:border-box;height:100%;background:linear-gradient(var(--sky) 50%, var(--grass) 50%);overscroll-behavior:none}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--font-body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(38,70,30,.38)}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);
  padding:20px 20px 24px;width:100%;max-width:360px;max-height:100%;overflow:auto;
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
#hero{width:150px;height:150px;max-width:100%}
h1{font-family:var(--font-display);font-weight:400;margin:0;font-size:clamp(30px,9.5vw,42px);line-height:1.12;
  color:var(--berry);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);text-wrap:balance;letter-spacing:.02em}
.lead{margin:0;font-weight:800;font-size:17px;line-height:1.6}
.btn{font-family:var(--font-display);font-size:21px;line-height:1.2;color:var(--ink);background:var(--sun);
  border:4px solid var(--ink);border-radius:999px;padding:14px 18px;width:100%;box-shadow:0 6px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn.alt{background:var(--pool)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.chip:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.eyebrow{margin:0;font-family:var(--font-display);font-size:28px;color:var(--ink)}
.big{margin:0;font-family:var(--font-display);font-size:26px}
.big b{font-size:54px;color:var(--berry);-webkit-text-stroke:1.5px var(--ink);font-weight:400}
.stars{display:flex;gap:6px}
.stars svg{width:54px;height:54px}
.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.icons img{width:40px;height:40px}
.chip{position:absolute;top:10px;font-family:var(--font-display);font-size:15px;color:var(--ink);background:var(--cream);
  border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:6px 12px;cursor:pointer;
  display:flex;align-items:center;gap:4px;touch-action:manipulation}
#mute{right:max(10px,env(safe-area-inset-right,0px));padding:6px 9px}
#quit{left:max(10px,env(safe-area-inset-left,0px))}
#mute svg{width:24px;height:24px;display:block}
#mute .x{display:none}
#mute.off .x{display:inline}
#mute.off .w{display:none}
.hint{margin:0;font-size:13px;opacity:.75}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
</style>

<div id="stage">
  <canvas id="cv" aria-label="どうぶつえんの ゲームがめん。どろんこの どうぶつを ゆびで こすって きれいにします"></canvas>

  <button id="mute" class="chip" type="button" aria-label="おとの オン・オフ">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3b2a1e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="#ffcf3f"/>
      <path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
      <path class="x" d="M17 9l5 6M22 9l-5 6"/>
    </svg>
  </button>
  <button id="quit" class="chip" type="button" hidden>おわる</button>

  <div id="title" class="overlay">
    <div class="card">
      <canvas id="hero" width="300" height="300" aria-hidden="true"></canvas>
      <h1>ピカピカ<br>どうぶつえん</h1>
      <p class="lead">どろんこの どうぶつを<br>ゆびで ごしごし あらってあげよう！</p>
      <button class="btn" id="go60" type="button">60びょう チャレンジ</button>
      <button class="btn alt" id="goFree" type="button">のんびり あそぶ</button>
    </div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="card">
      <p class="eyebrow">おしまい！</p>
      <div class="stars" id="stars"></div>
      <p class="big"><b id="rc">0</b> ひき ピカピカ！</p>
      <div class="icons" id="icons"></div>
      <button class="btn" id="again" type="button">もういちど</button>
      <button class="btn alt" id="toTitle" type="button">タイトルへ</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const INK = '#3b2a1e';
const FONT = '"Mochiy Pop One","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",sans-serif';
const SP = 256;   // sprite resolution
const DR = 128;   // dirt-mask resolution
const LIMIT = 60; // seconds in challenge mode
const KINDS = ['panda','bear','pig','sheep'];
const SPAWN_POOL = ['panda','panda','panda','bear','pig','sheep'];
const NAMES = {panda:'パンダ', bear:'しろくま', pig:'ブタ', sheep:'ヒツジ'};
const FACE = {
  panda:{ex:[64,96], ey:63, my:85, dark:true},
  bear: {ex:[64,96], ey:60, my:87},
  pig:  {ex:[63,97], ey:56, my:94},
  sheep:{ex:[71,89], ey:64, my:88}
};

/* ---------- helpers ---------- */
const mk = (w,h) => { const c=document.createElement('canvas'); c.width=Math.max(1,w|0); c.height=Math.max(1,h|0); return c; };
const rng = s => () => { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const R = Math.random;
function E(g,x,y,rx,ry,rot,fill,stroke=true){ g.beginPath(); g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2); g.fillStyle=fill; g.fill(); if(stroke) g.stroke(); }
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ---------- animal sprites (drawn in a 160-unit box) ---------- */
function face(g,f,expr){
  const [l,r]=f.ex, y=f.ey;
  g.strokeStyle=INK;
  if(expr==='happy'){
    g.lineWidth=3.6; g.strokeStyle=f.dark?'#ffffff':INK;
    for(const x of [l,r]){ g.beginPath(); g.arc(x,y+3,5.5,Math.PI*1.1,Math.PI*1.9); g.stroke(); }
    g.strokeStyle=INK;
    g.fillStyle='rgba(255,110,140,.5)';
    for(const x of [l-9,r+9]){ g.beginPath(); g.ellipse(x,y+14,6.5,4.2,0,0,7); g.fill(); }
    g.beginPath(); g.moveTo(72,f.my-2); g.quadraticCurveTo(80,f.my+12,88,f.my-2); g.closePath();
    g.fillStyle='#e8536b'; g.fill(); g.lineWidth=2.6; g.stroke();
  } else {
    for(const x of [l,r]){
      if(f.dark) E(g,x,y,5.6,6,0,'#ffffff',false);
      E(g,x,y+.5,3.8,4.3,0,'#1d1a1a',false);
      E(g,x+1.4,y-1.5,1.4,1.4,0,'#ffffff',false);
    }
    if(!f.dark){ g.lineWidth=2.6; g.beginPath(); g.moveTo(l-6,y-8); g.lineTo(l+4,y-12); g.moveTo(r+6,y-8); g.lineTo(r-4,y-12); g.stroke(); }
    g.lineWidth=2.6; g.beginPath(); g.arc(80,f.my+6,5,Math.PI*1.22,Math.PI*1.78); g.stroke();
  }
}
function drawSprite(type,expr){
  const c=mk(SP,SP), g=c.getContext('2d');
  g.scale(SP/160,SP/160); g.lineWidth=3.2; g.strokeStyle=INK; g.lineJoin='round'; g.lineCap='round';
  if(type==='panda'){
    const Wt='#fdfdfb', B='#2d2a2e';
    E(g,48,40,14,14,0,B); E(g,112,40,14,14,0,B);
    E(g,58,140,17,12,0,B); E(g,102,140,17,12,0,B);
    E(g,80,112,40,33,0,Wt);
    E(g,45,106,12,20,.5,B); E(g,115,106,12,20,-.5,B);
    E(g,80,64,42,35,0,Wt);
    E(g,63,63,11,14,.55,B,false); E(g,97,63,11,14,-.55,B,false);
    E(g,80,77,6,4.5,0,B,false);
  } else if(type==='bear'){
    const C='#f6f1e3';
    E(g,50,38,13,13,0,C); E(g,50,38,6.5,6.5,0,'#f2c4c4',false);
    E(g,110,38,13,13,0,C); E(g,110,38,6.5,6.5,0,'#f2c4c4',false);
    E(g,58,140,17,12,0,C); E(g,102,140,17,12,0,C);
    E(g,80,112,41,34,0,C);
    E(g,45,108,12,20,.5,C); E(g,115,108,12,20,-.5,C);
    E(g,80,64,40,34,0,C);
    E(g,80,80,15,11,0,'#fffdf7');
    E(g,80,75,7,5,0,'#2d2a2e',false);
  } else if(type==='pig'){
    const P='#f9bccb', P2='#f08aa3';
    g.lineWidth=7; g.beginPath(); g.moveTo(116,112); g.bezierCurveTo(134,98,140,122,126,119); g.bezierCurveTo(118,117,124,104,133,106); g.stroke();
    g.lineWidth=3.4; g.strokeStyle=P2; g.stroke(); g.strokeStyle=INK; g.lineWidth=3.2;
    g.beginPath(); g.moveTo(50,48); g.lineTo(44,18); g.lineTo(70,36); g.closePath(); g.fillStyle=P; g.fill(); g.stroke();
    g.beginPath(); g.moveTo(110,48); g.lineTo(116,18); g.lineTo(90,36); g.closePath(); g.fill(); g.stroke();
    E(g,58,140,15,12,0,P); E(g,102,140,15,12,0,P);
    E(g,80,112,42,33,0,P);
    E(g,46,110,11,17,.5,P); E(g,114,110,11,17,-.5,P);
    E(g,80,66,40,34,0,P);
    E(g,80,78,14,10,0,P2);
    E(g,75,78,2.6,3.8,0,INK,false); E(g,85,78,2.6,3.8,0,INK,false);
  } else { // sheep
    const Wl='#fbfaf3', Sk='#f0d6b4';
    E(g,60,145,7.5,11,0,'#4a3b33'); E(g,100,145,7.5,11,0,'#4a3b33');
    const pts=[]; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; pts.push([80+Math.cos(a)*34,112+Math.sin(a)*24]); }
    g.fillStyle=Wl; for(const [x,y] of pts){ g.beginPath(); g.arc(x,y,13,0,7); g.fill(); g.stroke(); }
    for(const [x,y] of pts){ g.beginPath(); g.arc(x,y,11.3,0,7); g.fill(); }
    E(g,80,112,36,26,0,Wl,false);
    E(g,49,62,12,6,.3,Sk); E(g,111,62,12,6,-.3,Sk);
    E(g,80,66,27,31,0,Sk);
    const tuft=[[66,40,10],[80,34,11],[94,40,10]];
    g.fillStyle=Wl; for(const [x,y,r] of tuft){ g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.stroke(); }
    for(const [x,y,r] of tuft){ g.beginPath(); g.arc(x,y,r-1.6,0,7); g.fill(); }
    E(g,80,80,4,3,0,'#8a5a44',false);
  }
  face(g,FACE[type],expr);
  return c;
}
const SPR={}, SIL={}, ICON={};
for(const t of KINDS){
  SPR[t]={sad:drawSprite(t,'sad'), happy:drawSprite(t,'happy')};
  const c=mk(DR,DR), g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(SPR[t].sad,0,0,DR,DR);
  const d=g.getImageData(0,0,DR,DR).data, a=new Uint8Array(DR*DR);
  for(let i=0;i<a.length;i++) a[i]=d[i*4+3];
  SIL[t]=a;
  ICON[t]=SPR[t].happy.toDataURL();
}

function makeDirt(type){
  const c=mk(DR,DR), d=c.getContext('2d',{willReadFrequently:true});
  d.fillStyle='rgba(135,95,55,0.74)'; d.fillRect(0,0,DR,DR);
  for(let i=0;i<16;i++){
    const x=DR*(.15+R()*.7), y=DR*(.15+R()*.75), r=DR*(.07+R()*.1);
    const gr=d.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(92,58,28,.95)'); gr.addColorStop(1,'rgba(92,58,28,0)');
    d.fillStyle=gr; d.beginPath(); d.arc(x,y,r,0,7); d.fill();
  }
  d.fillStyle='rgba(70,44,20,.85)';
  for(let i=0;i<55;i++){ d.beginPath(); d.arc(DR*(.1+R()*.8),DR*(.1+R()*.85),.8+R()*2,0,7); d.fill(); }
  // let the eyes peek through the mud
  d.globalCompositeOperation='destination-out';
  const f=FACE[type];
  for(const x of f.ex){
    const ex=x*DR/160, ey=f.ey*DR/160, r=DR*.075;
    const gr=d.createRadialGradient(ex,ey,0,ex,ey,r);
    gr.addColorStop(0,'rgba(0,0,0,.7)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    d.fillStyle=gr; d.beginPath(); d.arc(ex,ey,r,0,7); d.fill();
  }
  d.globalCompositeOperation='destination-in';
  d.drawImage(SPR[type].sad,0,0,DR,DR);
  d.globalCompositeOperation='source-over';
  return {c,d};
}
function countDirt(a){
  const data=a.dctx.getImageData(0,0,DR,DR).data; let n=0;
  for(let i=3;i<data.length;i+=8) if(data[i]>40) n++;
  return n;
}

/* ---------- audio ---------- */
let AC=null, noiseGain=null, noiseFilter=null, muted=false;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    noiseFilter=AC.createBiquadFilter(); noiseFilter.type='bandpass'; noiseFilter.frequency.value=2400; noiseFilter.Q.value=.9;
    noiseGain=AC.createGain(); noiseGain.gain.value=0;
    src.connect(noiseFilter).connect(noiseGain).connect(AC.destination); src.start();
  }catch(e){ AC=null; }
}
function tone(f,t0,dur,type='sine',vol=.18){
  if(!AC||muted) return;
  const t=AC.currentTime+t0, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
}
const chime = () => [1046,1318,1568,2093].forEach((f,i)=>tone(f,i*.08,.35,'triangle',.16));
const popSnd = () => tone(700+Math.random()*700,0,.07,'sine',.05);
const whistle = () => { tone(1568,0,.25,'square',.06); tone(1568,.32,.6,'square',.06); };
let scrubOn=false;
function setScrub(on,speed){
  if(!AC||!noiseGain) return;
  const want = on && !muted;
  if(want!==scrubOn){ noiseGain.gain.setTargetAtTime(want?.11:0,AC.currentTime,.04); scrubOn=want; }
  if(want) noiseFilter.frequency.setTargetAtTime(1800+Math.min(2200,speed*40),AC.currentTime,.05);
}

/* ---------- layout & baked scenery ---------- */
let W=0,H=0,DPR=1,D=100,BR=24;
const G={};
let skyL=null, groundL=null, bamboo=null, hut=null, scenery=[];
function resize(){
  const r=cv.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,r.width); H=Math.max(1,r.height);
  cv.width=W*DPR|0; cv.height=H*DPR|0;
  layout();
}
function layout(){
  G.fenceY=H*.19; G.groundTop=H*.25; G.hudTop=H*.855; G.hudH=H-G.hudTop;
  D=Math.min(W*.34,H*.2);
  BR=Math.max(22,D*.21);
  G.playTop=G.groundTop+D*.72; G.playBot=G.hudTop-D*.06;
  const gh=G.hudTop-G.groundTop;
  G.pond={x:W*.62, y:G.groundTop+gh*.2, rx:W*.27, ry:Math.max(24,H*.05)};
  scenery=[
    {kind:'bamboo', x:W*.15, y:G.groundTop+gh*.5},
    {kind:'bamboo', x:W*.42, y:G.groundTop+gh*.9},
    {kind:'hut',    x:W*.81, y:G.groundTop+gh*.62}
  ];
  bake();
}
function cloud(g,x,y,s){ for(const [dx,dy,r] of [[0,0,1],[.9,.15,.75],[-.9,.2,.7],[.35,-.45,.7]]){ g.beginPath(); g.arc(x+dx*s,y+dy*s,r*s,0,7); g.fill(); } }
function tree(g,x,base,s){
  g.fillStyle='#8d5a2b'; g.strokeStyle='#5d3a1a'; g.lineWidth=2;
  rr(g,x-s*.12,base-s*1.1,s*.24,s*1.1,4); g.fill(); g.stroke();
  g.fillStyle='#4caf50'; g.strokeStyle='#2e7d32';
  for(const [dx,dy,r] of [[0,-1.55,.62],[-.5,-1.15,.5],[.5,-1.15,.52],[0,-1.05,.5]]){ g.beginPath(); g.arc(x+dx*s,base+dy*s,r*s,0,7); g.fill(); g.stroke(); }
  g.fillStyle='#4caf50';
  for(const [dx,dy,r] of [[0,-1.55,.58],[-.5,-1.15,.46],[.5,-1.15,.48],[0,-1.05,.46]]){ g.beginPath(); g.arc(x+dx*s,base+dy*s,r*s,0,7); g.fill(); }
}
function bake(){
  const rnd=rng(11);
  // sky layer
  skyL=mk(W*DPR,H*DPR); let g=skyL.getContext('2d'); g.scale(DPR,DPR);
  const sg=g.createLinearGradient(0,0,0,G.fenceY); sg.addColorStop(0,'#6ec6f2'); sg.addColorStop(1,'#d6f1ff');
  g.fillStyle=sg; g.fillRect(0,0,W,G.fenceY+30);
  g.fillStyle='rgba(255,255,255,.92)'; cloud(g,W*.2,G.fenceY*.22,W*.07); cloud(g,W*.72,G.fenceY*.14,W*.055);
  g.lineWidth=2.5; g.strokeStyle='#7d7d7d'; g.fillStyle='#c4c4c4'; g.lineJoin='round';
  g.beginPath(); g.moveTo(W*.36,G.fenceY); g.lineTo(W*.45,G.fenceY*.38); g.lineTo(W*.51,G.fenceY*.5); g.lineTo(W*.58,G.fenceY*.24); g.lineTo(W*.7,G.fenceY); g.closePath(); g.fill(); g.stroke();
  g.fillStyle='#9ad86f'; g.fillRect(0,G.fenceY-H*.035,W,H*.06);
  tree(g,W*.04,G.fenceY-H*.01,Math.min(W*.12,H*.06)); tree(g,W*.24,G.fenceY-H*.015,Math.min(W*.08,H*.045));
  tree(g,W*.8,G.fenceY-H*.015,Math.min(W*.09,H*.05)); tree(g,W*.97,G.fenceY-H*.01,Math.min(W*.13,H*.065));

  // ground layer (fence, grass, enclosure floor, pond, HUD lawn)
  groundL=mk(W*DPR,H*DPR); g=groundL.getContext('2d'); g.scale(DPR,DPR);
  const top=G.fenceY-H*.042, bot=G.fenceY+H*.012;
  g.fillStyle='#86d160'; g.fillRect(0,bot,W,G.groundTop-bot+H*.03);
  g.strokeStyle='#8a9aa6'; g.lineWidth=2; g.fillStyle='#ffffff';
  const step=Math.max(14,W/24);
  for(let x=step/2;x<W;x+=step){ rr(g,x-3,top,6,bot-top+6,3); g.fill(); g.stroke(); }
  rr(g,-4,top-5,W+8,9,4); g.fill(); g.stroke();
  rr(g,-4,bot-5,W+8,9,4); g.fill(); g.stroke();
  // floor
  g.fillStyle='#e9e5d9'; g.strokeStyle='#c8c2b0'; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,G.groundTop+14);
  for(let x=0;x<=W+20;x+=24) g.quadraticCurveTo(x+12,G.groundTop+(x/24%2?4:20),x+24,G.groundTop+12);
  g.lineTo(W,G.hudTop+12); g.lineTo(0,G.hudTop+12); g.closePath(); g.fill(); g.stroke();
  g.fillStyle='#d6d0c0';
  for(let i=0;i<40;i++){ g.beginPath(); g.ellipse(rnd()*W,G.groundTop+30+rnd()*(G.hudTop-G.groundTop-40),2+rnd()*4,1.5+rnd()*2,0,0,7); g.fill(); }
  // pond
  const p=G.pond;
  g.lineWidth=2; g.strokeStyle='#8d8d8d';
  for(let i=0;i<26;i++){
    const a=i/26*Math.PI*2, x=p.x+Math.cos(a)*p.rx*1.05, y=p.y+Math.sin(a)*p.ry*1.22, r=p.ry*(.28+rnd()*.18);
    g.fillStyle=i%3?'#cfcfcf':'#bdbdbd'; g.beginPath(); g.ellipse(x,y,r*1.3,r,0,0,7); g.fill(); g.stroke();
  }
  const wg=g.createLinearGradient(0,p.y-p.ry,0,p.y+p.ry); wg.addColorStop(0,'#2a8de0'); wg.addColorStop(1,'#68d0f7');
  g.fillStyle=wg; g.strokeStyle='#1a6bb8'; g.lineWidth=2.5;
  g.beginPath(); g.ellipse(p.x,p.y,p.rx,p.ry,0,0,7); g.fill(); g.stroke();
  g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=3; g.lineCap='round';
  g.beginPath(); g.ellipse(p.x-p.rx*.3,p.y-p.ry*.2,p.rx*.3,p.ry*.3,0,Math.PI*1.1,Math.PI*1.6); g.stroke();
  g.beginPath(); g.ellipse(p.x+p.rx*.35,p.y+p.ry*.25,p.rx*.18,p.ry*.2,0,Math.PI*1.1,Math.PI*1.6); g.stroke();
  // lawn under the HUD
  g.fillStyle='#7cc85a'; g.strokeStyle='#5aa83d'; g.lineWidth=2.5;
  g.beginPath(); g.moveTo(0,G.hudTop+4);
  for(let x=0;x<=W+20;x+=30) g.quadraticCurveTo(x+15,G.hudTop-(x/30%2?6:-2),x+30,G.hudTop+2);
  g.lineTo(W,H+2); g.lineTo(0,H+2); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle='#5fae43'; g.lineWidth=2;
  for(let i=0;i<24;i++){ const x=rnd()*W, y=G.hudTop+14+rnd()*(G.hudH-20); g.beginPath(); g.moveTo(x-4,y); g.lineTo(x-1,y-7); g.moveTo(x+4,y); g.lineTo(x+1,y-8); g.stroke(); }

  bamboo=makeBamboo(); hut=makeHut();
}
function makeBamboo(){
  const w=D*1.05, h=D*1.55, c=mk(w*DPR,h*DPR), g=c.getContext('2d'), rnd=rng(7);
  g.scale(DPR,DPR); g.lineWidth=2; g.strokeStyle='#2e6b25'; g.lineJoin='round';
  g.fillStyle='rgba(60,120,40,.25)'; g.beginPath(); g.ellipse(w/2,h-4,w*.46,6,0,0,7); g.fill();
  for(let i=0;i<6;i++){
    const x=w*(.17+i*.135)+(rnd()-.5)*6, tp=h*(.04+rnd()*.26), sw=w*.065;
    g.fillStyle=i%2?'#7fd052':'#69bf3f'; rr(g,x-sw/2,tp,sw,h-tp-4,sw/2); g.fill(); g.stroke();
    for(let y=tp+h*.13;y<h-8;y+=h*.15){ g.beginPath(); g.moveTo(x-sw/2,y); g.lineTo(x+sw/2,y); g.stroke(); }
    for(let k=0;k<3;k++){
      const ly=tp+k*h*.13+5, dir=(k+i)%2?1:-1;
      g.save(); g.translate(x,ly); g.rotate(dir*(.45+rnd()*.4));
      g.fillStyle='#43a83a'; g.beginPath(); g.ellipse(dir*w*.1,0,w*.11,w*.028,0,0,7); g.fill(); g.stroke(); g.restore();
    }
  }
  return {c,w,h};
}
function makeHut(){
  const w=D*.95, h=D*1.0, c=mk(w*DPR,h*DPR), g=c.getContext('2d');
  g.scale(DPR,DPR); g.lineWidth=2.2; g.strokeStyle=INK; g.lineJoin='round';
  g.fillStyle='rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(w/2,h-3,w*.45,5,0,0,7); g.fill();
  g.fillStyle='#8d5a2b';
  for(const x of [.18,.78]){ rr(g,w*x,h*.7,w*.06,h*.29,2); g.fill(); g.stroke(); }
  g.fillStyle='#a86b35'; rr(g,w*.06,h*.68,w*.88,h*.07,3); g.fill(); g.stroke();
  g.fillStyle='#d09456'; rr(g,w*.13,h*.37,w*.74,h*.32,2); g.fill(); g.stroke();
  g.strokeStyle='rgba(90,55,25,.55)'; g.lineWidth=1.5;
  for(let x=w*.2;x<w*.86;x+=w*.09){ g.beginPath(); g.moveTo(x,h*.38); g.lineTo(x,h*.68); g.stroke(); }
  g.strokeStyle=INK; g.lineWidth=2.2;
  g.fillStyle='#4e3420'; g.beginPath(); g.moveTo(w*.39,h*.69); g.lineTo(w*.39,h*.52); g.arc(w*.5,h*.52,w*.11,Math.PI,0); g.lineTo(w*.61,h*.69); g.closePath(); g.fill(); g.stroke();
  g.fillStyle='#c79245'; g.beginPath(); g.moveTo(w*.01,h*.43); g.lineTo(w*.5,h*.03); g.lineTo(w*.99,h*.43); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle='rgba(110,70,20,.6)'; g.lineWidth=1.5;
  for(let i=1;i<7;i++){ const t=i/7; g.beginPath(); g.moveTo(w*.5,h*.06); g.lineTo(w*(.03+t*.94),h*.42); g.stroke(); }
  return {c,w,h};
}

/* ---------- game state ---------- */
let mode='title', timed=true, timeLeft=LIMIT, score=0, cleanedTypes=[], clock=0, endAt=0;
let animals=[], parts=[], popups=[], pending=[];
let cheerT=0, msg='', msgT=0, lastScrub=-9, scrubSpeed=0, lastPop=0, warned=false;
const ptrs=new Map(); let hover=null;

function pickTarget(a){ a.tx=.06+R()*.88; a.ty=R(); }
function spawn(delay=0){
  const type=SPAWN_POOL[R()*SPAWN_POOL.length|0], side=R()<.5?-1:1, dirt=makeDirt(type);
  const a={type, nx:side<0?-.2:1.2, ny:.08+R()*.84, state:'enter', facing:-side, wait:delay,
    speed:34+Math.min(40,score*3), dirt:dirt.c, dctx:dirt.d, fade:1, dirtFrac:1, scrubT:-9,
    needCount:false, countT:0, walk:R()*6, bobY:0, hop:0, wig:0, cleanT:0, tilt:0};
  a.init=countDirt(a)||1;
  a.tx=.18+R()*.64; a.ty=R();
  animals.push(a);
}
function apos(a){ return {x:a.nx*W, y:G.playTop+a.ny*(G.playBot-G.playTop)}; }
function toLocal(a,px,py){
  const p=apos(a), oy=p.y+a.bobY-a.hop;
  const u=(px-p.x)*a.facing, v=py-oy;
  return {x:(u+D/2)*DR/D, y:(v+D)*DR/D};
}
function onBody(a,lx,ly){ const x=lx|0, y=ly|0; return x>=0&&y>=0&&x<DR&&y<DR&&SIL[a.type][y*DR+x]>100; }
function erase(a,lx,ly,br){
  const g=a.dctx;
  g.globalCompositeOperation='destination-out';
  const gr=g.createRadialGradient(lx,ly,0,lx,ly,br);
  gr.addColorStop(0,'rgba(0,0,0,.34)'); gr.addColorStop(.6,'rgba(0,0,0,.24)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(lx,ly,br,0,7); g.fill();
  g.globalCompositeOperation='source-over';
}
function addBubble(x,y,big){
  if(parts.length>260) return;
  parts.push({k:'b', x:x+(R()-.5)*BR*1.4, y:y+(R()-.5)*BR*1.2, r:(big?5:3)+R()*(big?9:5),
    vx:(R()-.5)*24, vy:-12-R()*36, life:0, max:.7+R()*.9});
}
function scrubSeg(x0,y0,x1,y1){
  const dist=Math.hypot(x1-x0,y1-y0), n=Math.max(1,Math.ceil(dist/(BR*.35)));
  const list=animals.filter(a=>a.state==='enter'||a.state==='wander');
  const br=BR*DR/D; let hit=false;
  for(let i=1;i<=n;i++){
    const t=i/n, x=x0+(x1-x0)*t, y=y0+(y1-y0)*t; let here=false;
    for(const a of list){
      const l=toLocal(a,x,y);
      if(l.x<-br||l.y<-br||l.x>DR+br||l.y>DR+br) continue;
      erase(a,l.x,l.y,br); a.needCount=true;
      if(onBody(a,l.x,l.y)){ a.scrubT=clock; here=hit=true; }
    }
    if(R()<(here?.55:.12)) addBubble(x,y,here);
  }
  if(hit){ lastScrub=clock; scrubSpeed=dist; }
}
function cleaned(a){
  a.state='clean'; a.cleanT=0; score++; cleanedTypes.push(a.type);
  const p=apos(a);
  for(let i=0;i<16;i++){ const an=R()*Math.PI*2, sp=80+R()*160;
    parts.push({k:'s', x:p.x, y:p.y-D*.5, vx:Math.cos(an)*sp, vy:Math.sin(an)*sp-40, r:5+R()*7, life:0, max:.7+R()*.5, rot:R()*6, col:R()<.5?'#ffe14d':'#ffffff'}); }
  popups.push({text:'ピカピカ！', x:p.x, y:p.y-D*1.05, life:0, max:1.3, size:Math.max(22,D*.22), col:'#ffe14d'});
  chime(); cheerT=2.2;
  say(['ピカピカ！','きれいに なったね！','ありがとう！','すごーい！','じょうず！'][R()*5|0]+` ${NAMES[a.type]}も にっこり`,2.2);
  pending.push(clock+1.2);
}
function say(t,sec){ msg=t; msgT=sec; }

function startGame(isTimed){
  initAudio();
  timed=isTimed; mode='play'; score=0; cleanedTypes=[]; timeLeft=LIMIT; warned=false;
  animals=[]; parts=[]; popups=[]; pending=[]; ptrs.clear();
  spawn(0); spawn(.5); spawn(1.2);
  say('どろんこを ゆびで ごしごし こすってね！',4);
  document.getElementById('title').hidden=true;
  document.getElementById('result').hidden=true;
  document.getElementById('quit').hidden=timed;
  try{ navigator.wakeLock?.request('screen').catch(()=>{}); }catch(e){}
}
function finish(){
  mode='end'; endAt=clock; ptrs.clear(); setScrub(false,0);
  popups.push({text:'おしまい！', x:W/2, y:H*.45, life:0, max:1.6, size:Math.max(34,W*.11), col:'#ff6f91'});
  whistle();
  document.getElementById('quit').hidden=true;
}
function showResult(){
  mode='result';
  document.getElementById('rc').textContent=score;
  const stars=score>=9?3:score>=5?2:score>=1?1:0;
  document.getElementById('stars').innerHTML=[0,1,2].map(i=>
    `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="${i<stars?'#ffcf3f':'#efe6d2'}" stroke="#3b2a1e" stroke-width="1.6" stroke-linejoin="round"/></svg>`).join('');
  const ic=document.getElementById('icons'); ic.innerHTML='';
  cleanedTypes.slice(0,30).forEach(t=>{ const im=new Image(); im.src=ICON[t]; im.alt=NAMES[t]; ic.appendChild(im); });
  document.getElementById('result').hidden=false;
}
function toTitle(){
  mode='title'; animals=[]; parts=[]; popups=[]; pending=[];
  spawn(0); spawn(.4); spawn(.9);
  document.getElementById('result').hidden=true;
  document.getElementById('quit').hidden=true;
  document.getElementById('title').hidden=false;
}

/* ---------- update ---------- */
function update(dt){
  clock+=dt;
  if(mode==='play' && timed){
    timeLeft=Math.max(0,timeLeft-dt);
    if(!warned && timeLeft<=10){ warned=true; say('あと すこし！ がんばれ！',2.5); }
    if(timeLeft<=0) finish();
  }
  if(mode==='end' && clock-endAt>1.7) showResult();
  cheerT=Math.max(0,cheerT-dt); msgT=Math.max(0,msgT-dt);
  setScrub(mode==='play' && clock-lastScrub<.12, scrubSpeed);

  pending=pending.filter(t=>{ if(clock>=t){ if((mode==='play'||mode==='title') && animals.filter(a=>a.state!=='leave').length<3) spawn(0); return false; } return true; });

  const span=G.playBot-G.playTop;
  for(const a of animals){
    const scrubbing=clock-a.scrubT<.35;
    a.wig=scrubbing?Math.sin(clock*30)*.05:a.wig*.85;
    if(a.state==='clean'){
      a.cleanT+=dt; a.fade=Math.max(0,a.fade-dt*2.2);
      a.hop=Math.abs(Math.sin(a.cleanT*7))*D*.13*Math.max(0,1-a.cleanT/1.9);
      if(a.cleanT>1.9){ a.state='leave'; a.tx=a.nx<.5?-.4:1.4; a.ty=a.ny; a.hop=0; }
    }
    let moving=false;
    if(!scrubbing && a.state!=='clean'){
      if(a.wait>0) a.wait-=dt;
      else{
        const dx=(a.tx-a.nx)*W, dy=(a.ty-a.ny)*span, dist=Math.hypot(dx,dy), sp=a.state==='leave'?150:a.speed;
        if(dist<3){
          if(a.state==='leave') a.dead=true;
          else{ a.state='wander'; a.wait=.6+R()*1.8; pickTarget(a); }
        } else {
          const st=Math.min(dist,sp*dt);
          a.nx+=dx/dist*st/W; a.ny+=dy/dist*st/span;
          if(Math.abs(dx)>2) a.facing=dx<0?-1:1;
          moving=true;
        }
      }
    }
    if(moving) a.walk+=dt*11;
    a.bobY=moving?-Math.abs(Math.sin(a.walk))*D*.05:0;
    a.tilt=moving?Math.sin(a.walk)*.06:a.tilt*.8;
    if(a.needCount && clock-a.countT>.12 && (a.state==='enter'||a.state==='wander')){
      a.countT=clock; a.needCount=false;
      a.dirtFrac=countDirt(a)/a.init;
      if(a.dirtFrac<.1 && mode==='play') cleaned(a);
    }
  }
  animals=animals.filter(a=>!a.dead);

  for(const p of parts){
    p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.k==='s'){ p.vy+=260*dt; p.vx*=.97; p.rot+=dt*6; } else { p.vx*=.98; }
  }
  parts=parts.filter(p=>{ const alive=p.life<p.max; if(!alive && p.k==='b' && clock-lastPop>.09 && R()<.3){ lastPop=clock; popSnd(); } return alive; });
  for(const p of popups){ p.life+=dt; p.y-=dt*28; }
  popups=popups.filter(p=>p.life<p.max);
}

/* ---------- draw ---------- */
function drawVisitors(){
  const vs=[{x:.09,hair:'#5a3825',shirt:'#ff8a65'},{x:.29,hair:'#2b2b2b',shirt:'#4fc3f7',cap:'#1e88e5'},{x:.5,hair:'#8d6e63',shirt:'#ffd54f'},{x:.7,hair:'#9e9e9e',shirt:'#81c784'},{x:.9,hair:'#3e2723',shirt:'#ba68c8'}];
  const r=Math.min(W*.065,H*.032);
  vs.forEach((v,i)=>{
    const x=v.x*W, cheer=cheerT>0;
    const jump=cheer?Math.abs(Math.sin(clock*9+i*1.3))*r*.6:Math.sin(clock*1.4+i)*r*.06;
    const y=G.fenceY-H*.042-r*.75-jump;
    ctx.lineWidth=2; ctx.strokeStyle=INK;
    if(cheer){
      ctx.strokeStyle=v.shirt; ctx.lineWidth=r*.38; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x-r*.8,y+r*1.2); ctx.lineTo(x-r*1.4,y-r*.3); ctx.moveTo(x+r*.8,y+r*1.2); ctx.lineTo(x+r*1.4,y-r*.3); ctx.stroke();
      ctx.lineWidth=2; ctx.strokeStyle=INK;
      E(ctx,x-r*1.4,y-r*.4,r*.24,r*.24,0,'#ffd8b5'); E(ctx,x+r*1.4,y-r*.4,r*.24,r*.24,0,'#ffd8b5');
    }
    ctx.fillStyle=v.shirt; rr(ctx,x-r*1.05,y+r*.75,r*2.1,r*2.2,r*.6); ctx.fill(); ctx.stroke();
    E(ctx,x,y,r,r,0,'#ffd8b5');
    ctx.fillStyle=v.cap||v.hair; ctx.beginPath(); ctx.ellipse(x,y-r*.25,r*1.02,r*.82,0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
    if(v.cap){ ctx.beginPath(); ctx.ellipse(x+r*.55,y-r*.25,r*.6,r*.16,0,0,7); ctx.fill(); ctx.stroke(); }
    E(ctx,x-r*.35,y+r*.12,r*.1,r*.13,0,INK,false); E(ctx,x+r*.35,y+r*.12,r*.1,r*.13,0,INK,false);
    if(cheer){ E(ctx,x,y+r*.5,r*.22,r*.2,0,'#e8536b'); }
    else { ctx.beginPath(); ctx.arc(x,y+r*.35,r*.22,.15*Math.PI,.85*Math.PI); ctx.stroke(); }
  });
}
function drawAnimal(a){
  const p=apos(a);
  ctx.fillStyle='rgba(60,50,30,.18)'; ctx.beginPath(); ctx.ellipse(p.x,p.y,D*.3,D*.065,0,0,7); ctx.fill();
  const inPond=Math.hypot((p.x-G.pond.x)/G.pond.rx,(p.y-G.pond.y)/G.pond.ry)<1;
  if(inPond){ ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2.5; const k=(clock*1.5)%1;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,D*(.3+k*.25),D*(.07+k*.05),0,0,7); ctx.globalAlpha=1-k; ctx.stroke(); ctx.globalAlpha=1; }
  ctx.save();
  ctx.translate(p.x,p.y+a.bobY-a.hop);
  ctx.rotate(a.tilt);
  const sq=a.wig;
  ctx.scale(a.facing*(1+sq),1-sq);
  const happy=a.state==='clean'||a.state==='leave'||clock-a.scrubT<.35;
  ctx.drawImage(happy?SPR[a.type].happy:SPR[a.type].sad,-D/2,-D,D,D);
  if(a.fade>0){ ctx.globalAlpha=a.fade; ctx.drawImage(a.dirt,-D/2,-D,D,D); ctx.globalAlpha=1; }
  ctx.restore();
  // stink lines over muddy animals
  if((a.state==='enter'||a.state==='wander') && a.dirtFrac>.3){
    ctx.strokeStyle='#7d8a3a'; ctx.lineWidth=3; ctx.lineCap='round';
    for(let k=-1;k<=1;k++){
      const ph=(clock*.9+k*.33+1)%1, sx=p.x+k*D*.2, base=p.y+a.bobY-D*1.0-ph*D*.15;
      ctx.globalAlpha=Math.sin(ph*Math.PI)*.85*Math.min(1,a.dirtFrac*1.4);
      ctx.beginPath();
      for(let s=0;s<=10;s++){ const yy=base-s*D*.022, xx=sx+Math.sin(s*.9+clock*5+k)*D*.03; s?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  // twinkles when nearly clean
  if((a.state==='enter'||a.state==='wander') && a.dirtFrac<.45){
    const n=2; for(let i=0;i<n;i++){ const t=(clock*2+i*.5+a.walk)%1; star(p.x+Math.sin(i*7+a.init)*D*.3,p.y-D*(.3+.5*((i*.37+a.walk*.1)%1)),D*.05*Math.sin(t*Math.PI),'#fff59d',0); }
  }
}
function star(x,y,r,col,rot){
  if(r<=0) return;
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle=col; ctx.beginPath();
  for(let i=0;i<8;i++){ const rad=i%2?r*.38:r, an=i*Math.PI/4; ctx.lineTo(Math.cos(an)*rad,Math.sin(an)*rad); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawSponge(x,y,ang,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); ctx.rotate(ang*.25+Math.sin(clock*18)*.08);
  const w=BR*1.9, h=BR*1.25;
  ctx.fillStyle='#ffe066'; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rr(ctx,-w/2,-h/2+h*.12,w,h*.88,h*.3); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff8fb1'; rr(ctx,-w/2,-h/2,w,h*.62,h*.3); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';
  for(const [dx,dy] of [[-.25,-.2],[.05,-.28],[.28,-.15],[-.05,-.08]]){ ctx.beginPath(); ctx.arc(dx*w,dy*h,h*.07,0,7); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha=1;
}
function drawKeeper(){
  const r=Math.min(G.hudH*.38,W*.1), x=12+r, y=G.hudTop+G.hudH*.56;
  ctx.lineWidth=2.4; ctx.strokeStyle=INK;
  ctx.fillStyle='#6a9e3a'; rr(ctx,x-r*1.1,y+r*.7,r*2.2,r*1.4,r*.5); ctx.fill(); ctx.stroke();
  E(ctx,x,y,r,r*.95,0,'#ffd8b5');
  E(ctx,x,y-r*.62,r*1.45,r*.32,0,'#d9b77a');
  ctx.fillStyle='#d9b77a'; ctx.beginPath(); ctx.ellipse(x,y-r*.7,r*.85,r*.62,0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#8d5a2b'; ctx.fillRect(x-r*.84,y-r*.86,r*1.68,r*.16);
  const blink=(clock%3.5)>3.35;
  if(blink){ ctx.beginPath(); ctx.moveTo(x-r*.48,y+r*.05); ctx.lineTo(x-r*.22,y+r*.05); ctx.moveTo(x+r*.22,y+r*.05); ctx.lineTo(x+r*.48,y+r*.05); ctx.stroke(); }
  else { E(ctx,x-r*.35,y+r*.05,r*.1,r*.13,0,INK,false); E(ctx,x+r*.35,y+r*.05,r*.1,r*.13,0,INK,false); }
  ctx.fillStyle='rgba(255,120,150,.45)'; ctx.beginPath(); ctx.ellipse(x-r*.6,y+r*.32,r*.15,r*.1,0,0,7); ctx.ellipse(x+r*.6,y+r*.32,r*.15,r*.1,0,0,7); ctx.fill();
  const talk=msgT>0?Math.abs(Math.sin(clock*12))*r*.12:0;
  ctx.fillStyle='#e8536b'; ctx.beginPath(); ctx.ellipse(x,y+r*.42,r*.2,r*.08+talk,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  if(msgT>0 && msg){
    const fs=Math.max(13,Math.min(17,W/24));
    ctx.font=`${fs}px ${FONT}`;
    const maxW=W-24-8, tw=Math.min(ctx.measureText(msg).width,maxW-28);
    const bw=tw+28, bh=fs+22, bx=10, by=G.hudTop-r*.2-bh-8;
    ctx.globalAlpha=Math.min(1,msgT*4);
    ctx.fillStyle='#ffffff'; ctx.strokeStyle=INK; ctx.lineWidth=3;
    rr(ctx,bx,by,bw,bh,bh/2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-r*.3,by+bh-1.5); ctx.lineTo(x,by+bh+12); ctx.lineTo(x+r*.35,by+bh-1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x-r*.3,by+bh); ctx.lineTo(x,by+bh+12); ctx.lineTo(x+r*.35,by+bh); ctx.stroke();
    ctx.fillStyle=INK; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(msg,bx+14,by+bh/2+1,maxW-28);
    ctx.globalAlpha=1;
  }
}
function outlinedText(t,x,y,size,fill,align='center'){
  ctx.font=`${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=Math.max(4,size*.18); ctx.strokeStyle=INK; ctx.strokeText(t,x,y);
  ctx.fillStyle=fill; ctx.fillText(t,x,y);
}
function drawHUD(){
  drawKeeper();
  // counter
  const cy=G.hudTop+G.hudH*.55, ic=Math.min(G.hudH*.7,W*.15), cx=W*.5;
  ctx.drawImage(SPR.panda.happy,cx-ic*1.05,cy-ic*.6,ic,ic);
  outlinedText(`×${score}`,cx+ic*.05,cy,Math.max(22,ic*.42),'#ffffff','left');
  // clock
  const r=Math.min(G.hudH*.32,W*.085), x=W-14-r, y=G.hudTop+G.hudH*.6;
  outlinedText('じかん',x,y-r-10,Math.max(12,r*.42),'#ffe14d');
  ctx.lineWidth=3; ctx.strokeStyle=INK;
  E(ctx,x,y,r,r,0,'#fffaf0');
  if(timed){
    const f=timeLeft/LIMIT;
    ctx.fillStyle=f>.3?'#5cc85c':'#ff6b6b';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.arc(x,y,r*.82,-Math.PI/2,-Math.PI/2+Math.PI*2*f); ctx.closePath(); ctx.fill();
    outlinedText(String(Math.ceil(timeLeft)),x,y+1,Math.max(14,r*.75),'#ffffff');
  } else {
    outlinedText('∞',x,y+1,Math.max(16,r*.9),'#5cc85c');
  }
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(skyL,0,0,W,H);
  drawVisitors();
  ctx.drawImage(groundL,0,0,W,H);
  const items=scenery.map(s=>({y:s.y,s})).concat(animals.map(a=>({y:apos(a).y,a})));
  items.sort((p,q)=>p.y-q.y);
  for(const it of items){
    if(it.a) drawAnimal(it.a);
    else {
      const s=it.s, sp=s.kind==='bamboo'?bamboo:hut;
      const hides=animals.some(a=>{ const q=apos(a); return q.y<s.y && Math.abs(q.x-s.x)<(sp.w+D)/2 && q.y>s.y-sp.h; });
      ctx.globalAlpha=hides?.45:1; ctx.drawImage(sp.c,s.x-sp.w/2,s.y-sp.h,sp.w,sp.h); ctx.globalAlpha=1;
    }
  }
  for(const p of parts){
    const k=p.life/p.max;
    if(p.k==='b'){
      ctx.globalAlpha=1-k*k; const r=p.r*(1+k*.3);
      ctx.fillStyle='rgba(225,245,255,.45)'; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(p.x-r*.35,p.y-r*.35,r*.22,0,7); ctx.fill();
    } else { ctx.globalAlpha=1-k; star(p.x,p.y,p.r,p.col,p.rot); }
  }
  ctx.globalAlpha=1;
  drawHUD();
  if(mode==='play'){
    for(const s of ptrs.values()) drawSponge(s.x,s.y,s.ang,1);
    if(hover && ptrs.size===0) drawSponge(hover.x,hover.y,0,.6);
  }
  for(const p of popups){
    const k=p.life/p.max, sc=k<.15?.5+k/.15*.6:1.1-Math.min(.1,(k-.15));
    ctx.save(); ctx.globalAlpha=k>.75?(1-k)/.25:1; ctx.translate(p.x,p.y); ctx.scale(sc,sc);
    outlinedText(p.text,0,0,p.size,p.col); ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ---------- input ---------- */
function pt(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',e=>{
  if(mode!=='play') return;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  initAudio();
  const p=pt(e); ptrs.set(e.pointerId,{x:p.x,y:p.y,ang:0});
  scrubSeg(p.x,p.y,p.x,p.y);
});
cv.addEventListener('pointermove',e=>{
  const p=pt(e);
  if(e.pointerType==='mouse') hover=p;
  const s=ptrs.get(e.pointerId); if(!s||mode!=='play') return;
  let evs=e.getCoalescedEvents?e.getCoalescedEvents():null; if(!evs||!evs.length) evs=[e];
  for(const ce of evs){ const q=pt(ce); scrubSeg(s.x,s.y,q.x,q.y); if(q.x!==s.x||q.y!==s.y) s.ang=Math.atan2(q.y-s.y,q.x-s.x); s.x=q.x; s.y=q.y; }
});
const lift=e=>ptrs.delete(e.pointerId);
cv.addEventListener('pointerup',lift); cv.addEventListener('pointercancel',lift);
cv.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') hover=null; });
cv.addEventListener('contextmenu',e=>e.preventDefault());

document.getElementById('go60').addEventListener('click',()=>startGame(true));
document.getElementById('goFree').addEventListener('click',()=>startGame(false));
document.getElementById('again').addEventListener('click',()=>startGame(timed));
document.getElementById('toTitle').addEventListener('click',toTitle);
document.getElementById('quit').addEventListener('click',()=>{ if(mode==='play') finish(); });
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',()=>{ initAudio(); muted=!muted; muteBtn.classList.toggle('off',muted); if(muted) setScrub(false,0); });
document.addEventListener('visibilitychange',()=>{ if(!AC) return; document.hidden?AC.suspend():AC.resume(); });

/* ---------- title illustration ---------- */
function drawHero(){
  const h=document.getElementById('hero'), g=h.getContext('2d'), s=h.width;
  g.clearRect(0,0,s,s);
  g.fillStyle='#e9f7ff'; g.beginPath(); g.arc(s/2,s/2,s*.48,0,7); g.fill();
  g.drawImage(SPR.panda.happy,s*.08,s*.06,s*.84,s*.84);
  const d=makeDirt('panda');
  g.save(); g.beginPath(); g.rect(0,0,s*.5,s); g.clip(); g.drawImage(d.c,s*.08,s*.06,s*.84,s*.84); g.restore();
  g.fillStyle='rgba(255,255,255,.75)'; g.strokeStyle='#ffffff'; g.lineWidth=3;
  for(const [x,y,r] of [[.55,.5,.05],[.62,.62,.035],[.5,.66,.03],[.7,.42,.03]]){ g.beginPath(); g.arc(s*x,s*y,s*r,0,7); g.fill(); g.stroke(); }
  g.save(); g.translate(s*.6,s*.56); g.rotate(-.35);
  g.fillStyle='#ffe066'; g.strokeStyle=INK; g.lineWidth=4; rr(g,-s*.12,-s*.05,s*.24,s*.12,s*.04); g.fill(); g.stroke();
  g.fillStyle='#ff8fb1'; rr(g,-s*.12,-s*.08,s*.24,s*.09,s*.04); g.fill(); g.stroke();
  g.restore();
}

/* ---------- boot ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(W>0) { update(dt); draw(); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
resize();
drawHero();
spawn(0); spawn(.4); spawn(.9);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
})();
</script>
